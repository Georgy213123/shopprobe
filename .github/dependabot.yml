version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups: { all: { patterns: ["*"] } }
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups: { all: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups: { all: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups: { all: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /probe
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups: { all: { patterns: ["*"] } }
