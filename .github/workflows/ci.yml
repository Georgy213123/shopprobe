name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  secrets:
    name: Поиск секретов (gitleaks, вся история)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --verbose .

  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Проверка сообщений коммитов PR
        run: |
          re='^(feat|fix|docs|test|refactor|perf|build|ci|chore|style|revert)(\([a-z0-9-]+\))?!?: .+'
          bad=0
          while read -r sha subject; do
            [[ "$subject" =~ $re ]] || { echo "✗ $sha $subject"; bad=1; }
          done < <(git log --format='%h %s' origin/${{ github.base_ref }}..HEAD --no-merges)
          exit $bad

  checks:
    name: lint, тесты, e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "1"
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/app
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/app_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - name: База для тестов
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE app_test"
      - name: Зависимости
        run: make install
      - name: Линтеры и типы
        run: make lint
      - name: Unit и интеграционные тесты
        run: make test
      - name: E2E (Playwright)
        run: make e2e
      - name: Отчёт Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/playwright-report-seeded/
            probe/reports/
          retention-days: 7

  audit:
    name: аудит зависимостей
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Зависимости без браузеров
        run: |
          (cd backend && uv sync --frozen)
          for d in frontend e2e probe; do
            if [ -f "$d/package-lock.json" ]; then (cd "$d" && npm ci --ignore-scripts); fi
          done
      - name: pip-audit и npm audit
        run: make audit

  compose:
    name: docker compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Стенд одной командой
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Состояние сервисов
        run: docker compose ps
      - name: Логи при падении
        if: failure()
        run: docker compose logs --no-color
      - name: Остановить
        if: always()
        run: docker compose down -v
