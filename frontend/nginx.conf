server {
  listen 8080;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://backend:8201;
    proxy_set_header Host $host;
  }

  # Отсутствующий файл сборки — честный 404, а не index.html.
  location /assets/ {
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
